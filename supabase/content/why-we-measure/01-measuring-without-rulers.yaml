title: "Measuring Without Rulers"
subtitle: "Why your foot makes a terrible measuring stick — and what humans invented instead"
estimated_minutes: 11
xp_reward: 85

turns:
  - type: tutor_message
    persona: nova
    text: |
      Imagine you're building a house. You tell the carpenter, "make the door **3 feet** wide." He measures with *his* feet — which are bigger than yours. The door comes out too wide, and nothing fits.

      This really happened, for thousands of years. Before we fix it, let's start from the very beginning: what does it even *mean* to measure something? Don't worry if this feels basic — we're building a floor you can stand on.

  - type: tutor_message
    persona: nova
    text: |
      Measuring is simpler than it sounds. It's just **comparing a thing to a known amount**.

      When you say "the table is 5 hand-spans long," you're really saying: *the table is 5 copies of my hand laid end to end.* That known amount — your hand — is called a **unit**.

      Every measurement, everywhere, is secretly answering one question: **how many units?**

  - type: tutor_message
    persona: nova
    text: |
      For most of history, people used their **bodies** as units, because a body is always with you:

      - the **cubit** — elbow to fingertip
      - the **foot** — literally a foot
      - the **hand** — the width of a palm (we still measure horses in "hands"!)

      Clever and convenient. But there's one giant problem hiding in all of them.

  - type: svg_graphic
    xp: 0
    title: "WHOSE FOOT?"
    caption: "The same plank is '4 feet' for one person and '3 feet' for another — the unit itself changes."
    svg: |
      <svg viewBox="0 0 360 120" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="11">
        <rect x="20" y="24" width="320" height="16" fill="#fde68a" stroke="#92400e"/>
        <text x="180" y="18" text-anchor="middle" fill="#0f172a">the same plank</text>
        <g>
          <text x="20" y="62" fill="#1e3a8a">small feet:</text>
          <rect x="95" y="52" width="60" height="12" fill="#bfdbfe" stroke="#1e3a8a"/><rect x="157" y="52" width="60" height="12" fill="#bfdbfe" stroke="#1e3a8a"/><rect x="219" y="52" width="60" height="12" fill="#bfdbfe" stroke="#1e3a8a"/><rect x="281" y="52" width="55" height="12" fill="#bfdbfe" stroke="#1e3a8a"/>
          <text x="300" y="78" fill="#1e3a8a">"4 feet"</text>
        </g>
        <g>
          <text x="20" y="104" fill="#b91c1c">big feet:</text>
          <rect x="95" y="94" width="105" height="12" fill="#fecaca" stroke="#b91c1c"/><rect x="202" y="94" width="105" height="12" fill="#fecaca" stroke="#b91c1c"/><rect x="309" y="94" width="27" height="12" fill="#fecaca" stroke="#b91c1c"/>
          <text x="300" y="118" fill="#b91c1c">"about 3 feet"</text>
        </g>
      </svg>

  - type: tutor_message
    persona: nova
    text: |
      There it is: **a unit that changes from person to person is useless for sharing.** My "3 feet" isn't your "3 feet."

      So humanity invented **standards** — one official metre, one official kilogram, kept safe and copied exactly everywhere. Now "5 metres" means the *same length* to a builder in Delhi and a builder in Tokyo. That one idea — an agreed, unchanging unit — is what makes science and trade possible at all.

  - type: tutor_message
    persona: nova
    text: |
      This gives us the single most important habit in all of physics. **Every measurement has two parts:**

      > a **number** and a **unit**

      "5 metres" is the number **5** and the unit **metre**. The number alone — just "5" — means nothing. Five what? Fingers? Kilometres? Years? Always, always keep the unit glued to the number.

  - type: svg_graphic
    xp: 0
    title: "NUMBER + UNIT, ALWAYS TOGETHER"
    caption: "The number says how many; the unit says of what. Neither works alone."
    svg: |
      <svg viewBox="0 0 360 90" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
        <g>
          <rect x="30" y="30" width="90" height="34" rx="7" fill="#dbeafe" stroke="#1e3a8a"/><text x="52" y="52" font-size="18" font-weight="bold" fill="#1e3a8a">5</text><text x="72" y="52" font-size="18" fill="#92400e">m</text>
          <text x="46" y="80" font-size="9" fill="#1e3a8a">how many</text><text x="98" y="80" font-size="9" fill="#92400e">of what</text>
        </g>
        <text x="140" y="52" fill="#475569">·  3 kg  ·  10 s  ·  40 °C</text>
        <text x="30" y="18" font-size="10" fill="#475569">a measurement =</text>
      </svg>

  - type: tutor_message
    persona: nova
    text: |
      Last piece. What makes a **good** standard unit? Three plain-English tests:

      1. **Everyone can copy it exactly** (not "roughly like my foot").
      2. **It never changes** — not with weather, not over the years.
      3. **People can actually get to it** to check their rulers against.

      Your foot fails all three. An official, defined metre passes all three. That's the whole reason the next lessons exist.

  - type: mcq
    xp: 15
    question: "Why does 'my foot' make a bad unit for everyone to use?"
    options:
      - id: a
        text: "Because feet are too small to measure big things."
        is_correct: false
        rationale: "Size isn't the real problem — you can lay a small unit end to end many times. The problem is that it's different for each person."
      - id: b
        text: "Because everyone's foot is a different length, so the same object gives different numbers."
        is_correct: true
        rationale: "Exactly. A unit has to mean the same thing to everyone. A personal foot changes from person to person, so measurements can't be shared."
      - id: c
        text: "Because feet can't measure weight."
        is_correct: false
        rationale: "True, but length units like the metre don't measure weight either — that's a different unit. The real issue is that feet vary between people."
      - id: d
        text: "Because the metric system is newer."
        is_correct: false
        rationale: "Being newer isn't the point. The point is a standard is the *same* for everyone, while a personal foot is not."

  - type: tap_to_match
    xp: 15
    prompt: "Match each old unit to the body part it came from."
    left:
      - { id: l1, label: "Cubit" }
      - { id: l2, label: "Foot" }
      - { id: l3, label: "Hand" }
      - { id: l4, label: "Pace" }
    right:
      - { id: r1, label: "Elbow to fingertip" }
      - { id: r2, label: "Length of a foot" }
      - { id: r3, label: "Width of a palm" }
      - { id: r4, label: "One walking step" }
    pairs:
      - [l1, r1]
      - [l2, r2]
      - [l3, r3]
      - [l4, r4]

  - type: fill_in_the_blank
    xp: 10
    prompt: "Lock in the big idea."
    template: |
      Every measurement is always a {{blank-1}} together with a {{blank-2}}. A unit that everyone agrees on and that never changes is called a {{blank-3}}.
    answers:
      - id: blank-1
        accepted: ["number", "Number", "numerical value"]
      - id: blank-2
        accepted: ["unit", "Unit"]
      - id: blank-3
        accepted: ["standard", "Standard"]

  - type: exercise
    xp: 20
    tool: pencil
    instruction: |
      Measure your study table's length twice: once in **hand-spans** (your own hand) and once with a **ruler or tape** in centimetres.

      On paper, write both results as *number + unit*. Then ask a family member to measure it in *their* hand-spans. Did the hand-span number change? Type what you found below.
    placeholder: "My table: ... hand-spans / ... cm. In another person's hands: ... hand-spans"

  - type: reflection
    xp: 5
    prompt: |
      People got by with body-part units for thousands of years before agreeing on standards.

      Why do you think it took so long for the whole world to agree on one set of units? What makes agreeing hard? No right answer.
    placeholder: "Agreeing on one standard was hard because..."

  - type: checkpoint
    xp: 0
    title: "You know what a unit is and why standards matter."
    summary: |
      Measuring means counting how many units fit in a thing, so every measurement is a *number*
      plus a *unit* — and the number alone is meaningless. Body-part units like the cubit fail
      because they change from person to person; a good standard is copyable, unchanging, and
      reachable, so a measurement means the same thing to everyone.

      Now, some things are mind-bogglingly big (the distance to the Sun) and others tiny (the size
      of an atom). Writing all those zeros is a nightmare. Next, you'll learn a superpower that
      makes huge and tiny numbers easy — powers of ten.
